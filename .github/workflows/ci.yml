name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rôle applicatif NON superutilisateur, comme sur Neon : sinon la RLS serait ignorée.
      - name: Préparer la base de test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE sama_app LOGIN PASSWORD 'sama' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE sama360_test OWNER sama_app"

      - run: pnpm build
      - run: pnpm --filter @sama360/api typecheck
      - run: pnpm test
      - run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgresql://sama_app:sama@localhost:5432/sama360_test
          REDIS_URL: redis://localhost:6379
