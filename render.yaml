# Déploiement Sama360 sur Render (Blueprint). Guide : DEPLOY.md
# Un service web (API + worker intégré + version web de l'app sur /app) et un Redis (Key Value).
# La base reste sur Neon.
# Région ohio : la même que la base Neon (us-east-2). Si la base change de région, changer ici aussi.
# Les valeurs « sync: false » sont demandées par Render à la création : on les colle soi-même.
services:
  - type: web
    name: sama360-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    # Gratuit pour commencer : le service s'endort après 15 min sans visite (≈1 min au réveil) et les
    # tâches de fond (relances, rappels) attendent le réveil. Passer à « starter » (7 $/mois) pour les vrais commerçants.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/contracts/**
        - apps/mobile/lib/**
        - apps/mobile/web/**
        - apps/mobile/assets/**
        - apps/mobile/pubspec.*
        - Dockerfile
        - pnpm-lock.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER
        value: "true"
      - key: MIGRATE_ON_START
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sama360-redis
          property: connectionString
      # Neon : DATABASE_URL avec le rôle sama_app (RLS), DATABASE_URL_DIRECT avec le propriétaire (migrations)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Codes de connexion : Twilio Verify, valable dans tous les pays (Sénégal, Côte d'Ivoire, Congo…).
      # Autres choix possibles : twilio (SMS simple) ou orange (Sénégal seulement), voir DEPLOY.md.
      - key: OTP_PROVIDER
        value: twilio_verify
      - key: OTP_CHANNEL
        value: sms # whatsapp une fois l'expéditeur WhatsApp configuré dans Twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      # Fichiers (logos, photos) : Cloudflare R2 ou tout service compatible S3
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Sama360 Pro : numéros des administrateurs (validation des paiements) et numéros qui reçoivent
      # les paiements d'abonnement par pays (ex. ADMIN_PHONES=+221781234567)
      - key: ADMIN_PHONES
        sync: false
      - key: PRO_PAY_TO_SN
        sync: false
      - key: PRO_PAY_TO_CI
        sync: false
      - key: PRO_PAY_TO_CG
        sync: false
      # Paiement en ligne de Pro par Chariow (voir DEPLOY.md, « Paiement en ligne ») : vide = paiement manuel seul
      - key: CHARIOW_API_KEY
        sync: false
      - key: CHARIOW_PULSE_SECRET
        sync: false
      - key: CHARIOW_PRODUCT_MONTHLY
        sync: false
      - key: CHARIOW_PRODUCT_YEARLY
        sync: false
      # Assistant IA et facture en photo : « anthropic » avec une clé, sinon « off »
      - key: ASSISTANT_PROVIDER
        value: "off"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SCAN_DAILY_LIMIT
        value: "20"

  - type: keyvalue
    name: sama360-redis
    region: ohio
    plan: free # 25 Mo : largement assez pour la file d'événements au démarrage
    maxmemoryPolicy: noeviction # obligatoire pour BullMQ : ne jamais effacer un travail en attente
    ipAllowList: [] # accessible seulement depuis les services Render
